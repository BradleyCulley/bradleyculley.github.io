name: Deploy blog subscription stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      SUBSCRIPTION_API_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Ensure Gemfile.lock supports Linux runners
        run: |
          set -e
          if [ -f Gemfile.lock ]; then
            bundle lock --add-platform x86_64-linux || true
          else
            bundle lock --add-platform x86_64-linux || true
          fi

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Ensure S3 state bucket exists
        run: |
          set -e
          BUCKET="culley-blog-terraform-state"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET exists"
          else
            echo "Creating bucket $BUCKET in ${AWS_REGION}"
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "${AWS_REGION}" || true
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "${AWS_REGION}" --create-bucket-configuration LocationConstraint=${AWS_REGION} || true
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Lambda function
        working-directory: aws/lambda
        run: |
          set -e
          npm install --production --no-audit --no-fund
          rm -f blog-subscribe.zip
          zip -r blog-subscribe.zip . -x "*.md" "package-lock.json"
          ls -l blog-subscribe.zip

      - name: Terraform init (with S3 backend)
        working-directory: terraform
        run: |
          terraform init -backend-config="bucket=culley-blog-terraform-state" \
                         -backend-config="key=terraform.tfstate" \
                         -backend-config="region=${AWS_REGION}"

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="db_username=${{ secrets.RDS_USERNAME }}" \
            -var="db_password=${{ secrets.RDS_PASSWORD }}"

      - name: Capture Lambda Function URL
        working-directory: terraform
        run: echo "SUBSCRIPTION_API_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"

      - name: Write Jekyll runtime config
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          config_path = File.expand_path('_config.yml')
          config = File.exist?(config_path) ? (YAML.load_file(config_path) || {}) : {}
          config['subscription_api_url'] = ENV.fetch('SUBSCRIPTION_API_URL', 'https://example.invalid/')
          File.write('_config.generated.yml', config.to_yaml)
          RUBY

      - name: Build Jekyll site
        run: bundle exec jekyll build --config _config.yml,_config.generated.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
